# AUTHORED -- this file is the source of truth for this endpoint.
#
# A `cases[]` entry is one test case and carries all 18 inventory columns.
# Content lives per case, not per endpoint: on POST /auth/token the purpose,
# request payload and response differ across tc01/tc02/tc03, and folding them
# up to the endpoint silently discarded two of the three.
#
# canonicalRef is contract-visible. Do not normalise it, do not fix its
# spelling -- the harness, run manifest and result document all key on it.
slug: employee_auth_api_post_auth_token
module: Employee Auth API
method: POST
endpointPath: /auth/token
environments:
- UAT
version: null
credentialAlias: null
metadata:
  x-required-role: none
  x-sla-ms: 1000
cases:
- apiId: '2'
  module: Employee Auth API
  subModule: TC01 - Valid credentials return JWT token
  access: public
  purpose: TC01 - Status is 200; TC01 - Full response matches OpenAPI LoginResponse; TC01 - Token is three-part
    JWT; TC01 - empCode and username returned; TC01 - roles is non-empty array
  basePath: '{{authBaseUrl}}'
  endpointPath: /auth/token
  method: POST
  requestParameters: 'headers: Content-Type=application/json'
  requestBodySchema: '{"empCode":"string","password":"string"}'
  responseExample: |-
    Expected status(es): 200
    {
      "empCode": "<empCode>",
      "roles": [
        "<role>"
      ],
      "token": "<jwt-token>",
      "username": "<username>"
    }
  owner: KavishTadas <kavish.tadas@omfysgroup.com>
  canonicalRef: post|/auth/token|employee auth api|tc01 - valid credentials return jwt token
  samplePayloads:
  - payloadType: Request Body
    json: '{"empCode": "{{empCode}}", "password": "{{empPassword}}"}'
  - payloadType: Example Request Payload
    json: |-
      {
        "empCode": "<empCode>",
        "password": "<empPassword>"
      }
  - payloadType: Example Response Payload
    json: |-
      {
        "empCode": "<empCode>",
        "roles": [
          "<role>"
        ],
        "token": "<jwt-token>",
        "username": "<username>"
      }
  rules:
  - category: Dependency
    description: Produces authToken for downstream APIs
  - category: Non-Functional
    description: 'Source: collections/auth/Employee_Auth_API.json; No saved response example in source
      file'
  assertionState: asserted
  sourceType: newman
  sourceCollection: collections/auth/Employee_Auth_API.json
