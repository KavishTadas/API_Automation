# RCA-001 -- suppress the nginx version banner, and add HSTS.
#
# Install as:  /etc/nginx/conf.d/hardening.conf
#
# A drop-in rather than an edit to nginx.conf, deliberately. Ubuntu's stock
# nginx.conf ends its http block with `include /etc/nginx/conf.d/*.conf;`, so
# everything here lands in http context exactly as if it had been typed into
# nginx.conf -- but nobody has to touch a shared file that other things depend
# on, the change is one reviewable object, and rollback is `rm` rather than an
# edit reversed by hand.
#
# Apply:
#     sudo cp hardening.conf /etc/nginx/conf.d/hardening.conf
#     sudo nginx -t                      # nothing changes until this passes
#     sudo systemctl reload nginx        # graceful; in-flight requests survive
#
# Roll back:
#     sudo rm /etc/nginx/conf.d/hardening.conf && sudo systemctl reload nginx
#
# Verify:
#     curl -sI https://<host>/ | grep -i server      # expect: Server: nginx
#
# NOT validated by `nginx -t` before shipping: the repository this came from
# runs on Windows with no nginx available, so step 2 above is the first real
# syntax check. It is four directives, but run it anyway.


# ---------------------------------------------------------------------------
# 1. The version banner
# ---------------------------------------------------------------------------
# Default is `on`, which appends the build number; the "(Ubuntu)" suffix is
# added by Debian packaging, so the stock banner discloses the distribution as
# well as the version. `off` reduces it to `Server: nginx`.
#
# This cannot delete the header -- that needs the separate headers-more module
# (libnginx-mod-http-headers-more-filter) and `more_clear_headers 'Server';`.
# The difference is small: a fingerprinter identifies nginx from error-page
# markup and header ordering regardless. Do NOT set it to another product's
# name; spoofing costs an attacker nothing and misleads your own operators.
#
# CAVEAT: a `server_tokens on;` appearing LATER in http context, or inside a
# server block, still wins. If the banner survives this change, grep for it:
#     grep -rn server_tokens /etc/nginx/
server_tokens off;


# ---------------------------------------------------------------------------
# 2. HSTS
# ---------------------------------------------------------------------------
# Absent on every host today. Worth more than the banner: the banner is
# reconnaissance, a missing HSTS is a live downgrade path on the first
# plaintext request.
#
# `always` is not optional. Without it the header is skipped on error
# responses -- which are precisely the ones an attacker provokes.
#
# max-age is one year. Browsers cache the directive, so it is awkward to walk
# back: if you would rather start cautiously, use 300 for a day, confirm
# nothing breaks, then raise it. Do not add `preload` unless you intend the
# domain to be submitted to the browser preload list, which is effectively
# irreversible.
#
# CAVEAT: nginx's add_header does not merge. Any server or location block that
# declares its own add_header discards every header inherited from here. If
# HSTS is missing on one path but present on others, that is why -- re-declare
# it in that block.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


# ---------------------------------------------------------------------------
# 3. Upstream banners
# ---------------------------------------------------------------------------
# Belt and braces. nginx already replaces an upstream Server header on proxied
# responses, and this estate's Spring Boot services send neither X-Powered-By
# nor X-AspNet-Version today. These keep it that way if an upstream changes:
# uncomment inside the proxying location block, not here -- proxy_hide_header
# is valid in http context but is clearer where the proxying happens.
#
#     location /api/ {
#         proxy_pass http://backend;
#         proxy_hide_header Server;
#         proxy_hide_header X-Powered-By;
#         proxy_hide_header X-AspNet-Version;
#     }
