# RCA-001 (banner only) -- stop nginx announcing its version.
#
# The smallest change that clears the "Host discloses no product version"
# failures: one directive, nothing else. nginx-hardening.conf beside this file
# also turns on HSTS with includeSubDomains for a year, which is a separate and
# much harder-to-reverse decision. Keeping them apart means this one can be
# approved without waiting on that one.
#
# Install as:  /etc/nginx/conf.d/server-tokens.conf
#
# Apply:
#     sudo cp nginx-server-tokens.conf /etc/nginx/conf.d/server-tokens.conf
#     sudo nginx -t                      # nothing changes until this passes
#     sudo systemctl reload nginx        # graceful; in-flight requests survive
#
# Roll back:
#     sudo rm /etc/nginx/conf.d/server-tokens.conf && sudo systemctl reload nginx
#
# Verify from anywhere:
#     python scripts/check_server_banner.py
#
# If the version still shows after a reload, something later wins -- a
# `server_tokens on;` in a server block overrides this:
#     grep -rn server_tokens /etc/nginx/
#
# Ubuntu's stock nginx.conf includes /etc/nginx/conf.d/*.conf inside its http
# block, so this lands in http context. If a site's config does not include
# conf.d, put the directive in the http block of nginx.conf instead.

server_tokens off;
