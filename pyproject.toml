[project]
name = "hcm-api-automation"
version = "0.1.0"
description = "HCM API automation suite for Newman, Bruno, OpenAPI, and generated pytest checks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-html>=4.1.0,<5.0.0",
    "allure-pytest>=2.13.0,<3.0.0",
    "PyYAML>=6.0,<7.0",
    "jsonschema>=4.23.0,<5.0.0"
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
addopts = "-p no:cacheprovider"
