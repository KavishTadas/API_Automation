name: API automation tests

on:
  push:
    branches: [main, develop, feature/hcm-leave-management-api]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: uat
        type: choice
        options: [uat, staging, production, local]
      collection:
        description: "Collection name or all"
        required: false
        default: all

jobs:
  generate-api-file:
    name: Generate API File
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest

    env:
      ENV:              uat
      API_TEST_ENV:     uat
      EMP_CODE:         ${{ secrets.EMP_CODE }}
      EMP_PASSWORD:     ${{ secrets.EMP_PASSWORD }}
      BASE_URL:         ${{ secrets.BASE_URL }}
      LEAVE_BASE_URL:   ${{ secrets.LEAVE_BASE_URL }}
      API_AUTH_TOKEN:   ${{ secrets.API_AUTH_TOKEN }}
      AUTH_TOKEN:       ${{ secrets.AUTH_TOKEN }}
      USERNAME:         ${{ secrets.USERNAME }}
      PASSWORD:         ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate API File
        run: node scripts/generate-api-file.js

      - name: Upload API File artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-file-${{ github.run_number }}
          path: |
            api-docs/API_File.csv
            api-docs/API_File.json
          retention-days: 30

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt

      - name: Generate generic pytest tests
        run: python scripts/generate-generic-tests.py

      - name: Run auto-generated tests with reports
        id: autogenerated-tests
        continue-on-error: true
        run: |
          mkdir -p reports/html reports/allure-results/generated-tests
          python -m pytest tests/auto_generated \
            --html=reports/html/auto-generated-pytest-report.html \
            --self-contained-html \
            --alluredir=reports/allure-results/generated-tests

      - name: Generate unified HTML index
        if: always()
        run: node scripts/generate-html-index.js

      - name: Setup Java (required for Allure)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate Allure HTML report for auto-generated tests
        if: always()
        run: >
          npx allure generate reports/allure-results/generated-tests
          --clean -o reports/allure-report/auto-generated-tests

      - name: Upload auto-generated test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-generated-api-test-reports-${{ github.run_number }}
          path: |
            reports/html/index.html
            reports/html/auto-generated-pytest-report.html
            reports/allure-results/generated-tests/
            reports/allure-report/auto-generated-tests/
          retention-days: 30

      - name: Fail if auto-generated tests failed
        if: steps.autogenerated-tests.outcome == 'failure'
        run: exit 1

  api-tests:
    runs-on: ubuntu-latest

    env:
      EMP_CODE:          ${{ secrets.EMP_CODE }}
      EMP_PASSWORD:      ${{ secrets.EMP_PASSWORD }}
      BASE_URL:          ${{ secrets.BASE_URL }}
      LEAVE_BASE_URL:    ${{ secrets.LEAVE_BASE_URL }}
      API_KEY:           ${{ secrets.API_KEY }}
      POSTMAN_API_KEY:   ${{ secrets.POSTMAN_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        id: run-tests
        env:
          ENV: ${{ inputs.environment || 'uat' }}
          COLLECTION_FILTER: ${{ inputs.collection || 'all' }}
        run: node scripts/run-newman.js

      - name: Setup Java (required for Allure)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate Allure HTML report
        if: always()
        run: npx allure generate reports/allure-results --clean -o reports/allure-report

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-report-${{ github.run_number }}
          path: reports/html/
          retention-days: 30

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ github.run_number }}
          path: reports/allure-results/
          retention-days: 30

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-html-report-${{ github.run_number }}
          path: reports/allure-report/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## API Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment || 'uat' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Collection:** ${{ inputs.collection || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

      - name: Slack alert on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: >-
            {"text":"API tests FAILED on
            ${{ github.ref_name }} -
            Run #${{ github.run_number }} -
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}


