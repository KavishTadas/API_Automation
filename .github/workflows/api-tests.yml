name: API automation tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [local, staging, production]
      collection:
        description: "Collection name or 'all'"
        required: false
        default: all

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}
      BASE_URL: ${{ secrets.BASE_URL }}
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: cross-env ENV=${{ inputs.environment || 'staging' }} node scripts/run-newman.js
        id: run-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: html-report, path: reports/html/, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: allure-results, path: reports/allure-results/, retention-days: 30 }
      - name: Write job summary
        if: always()
        run: |
          echo "## API Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Environment: ${{ inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
      - name: Slack alert on failure
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: '{"text":"API tests FAILED on ${{ github.ref }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

# Required secrets:
# API_KEY
# BASE_URL
# POSTMAN_API_KEY
# SLACK_WEBHOOK_URL (optional)
