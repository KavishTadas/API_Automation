name: API automation tests

on:
  push:
    branches: [main, develop, feature/hcm-leave-management-api, attendance]
  pull_request:
    branches: [main, develop, attendance]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: uat
        type: choice
        options: [uat, local]
      collection:
        description: "Collection name or all"
        required: false
        default: all

jobs:
  generate-api-file:
    name: Generate API File
    # main as well as develop: the job was gated to develop, so a merge to main
    # regenerated nothing and the committed inventory fell behind the branch
    # everyone clones.
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    runs-on: ubuntu-latest

    # GITHUB_TOKEN defaults to read-only, so without this the commit-back below
    # is rejected. The token is minted per run by GitHub -- nothing to create,
    # store or rotate.
    permissions:
      contents: write
      # main is protected, so the regeneration arrives as a pull request there
      # rather than as a push. gh pr create needs this.
      pull-requests: write

    env:
      ENV:              uat
      API_TEST_ENV:     uat
      EMP_CODE:         ${{ secrets.EMP_CODE }}
      EMP_PASSWORD:     ${{ secrets.EMP_PASSWORD }}
      BASE_URL:         ${{ secrets.BASE_URL }}
      LEAVE_BASE_URL:   ${{ secrets.LEAVE_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate API File
        run: node scripts/generate-api-file.js

      # The console is a committed, generated file and nothing rebuilt it, so
      # an endpoint could reach the inventory here and still be invisible in
      # the page a user actually opens. Regenerating it in the same job is what
      # closes that gap: inventory and console are written from one source, in
      # one commit, and can never disagree.
      # 3.11 to match the rest of the workflow. build_unified_console.py and
      # scan-credentials.py are both standard library only, so there is nothing
      # to install before they run.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild the unified console from the inventory
        run: python scripts/build_unified_console.py

      - name: Upload API File artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-file-${{ github.run_number }}
          path: |
            api-docs/API_File.csv
            api-docs/API_File.json
          retention-days: 30

      # This repository is public and has published a working password once
      # already. An automated committer without this guard is a mechanism for
      # doing it again on every push, unattended. Fails the job rather than
      # committing -- and fails loudly, because a silent skip would look
      # exactly like "nothing changed".
      # The scan covers every tracked file, not only the two this job writes.
      # The password that leaked was in a hand-maintained CSV that a
      # generated-files-only check could never have seen.
      - name: Refuse to commit anything credential-shaped
        run: python scripts/scan-credentials.py

      - name: Stage the regenerated files
        id: stage
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The console and the catalogue travel with the inventory. Committing
          # the inventory alone is what left the page showing an endpoint list
          # the repository had already moved past.
          git add api-docs/API_File.json api-docs/API_File.csv \
                  docs/platform-ui/unified-console.html \
                  docs/platform-handoff/sample-catalogue.json

          # Nothing to do is the normal case: most pushes do not change an
          # endpoint. Committing anyway would fill the history with empty
          # commits and retrigger the workflow on every one.
          if git diff --cached --quiet ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Inventory and console unchanged - nothing to commit."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # [skip ci] stops this from retriggering the workflow that created
          # it. Without it, a commit on a watched branch starts another run,
          # which commits again.
          git commit -m "Regenerate the API inventory and console [skip ci]"

      # develop is not protected, so the commit lands directly.
      - name: Push to an unprotected branch
        if: steps.stage.outputs.changed == 'true' && github.ref_name != 'main'
        run: |
          set -euo pipefail
          # A rebase rather than a merge: another push landing mid-run should
          # replay this one commit on top, not create a merge bubble.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}" ; then
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "Committed to ${GITHUB_REF_NAME}."

      # main is protected, so a direct push is rejected however the token is
      # scoped -- branch protection is enforced against GITHUB_TOKEN too. The
      # regeneration therefore arrives as a pull request for review.
      #
      # Known limitation, stated rather than discovered later: a PR opened with
      # GITHUB_TOKEN does not itself trigger workflows. GitHub blocks that to
      # prevent recursion, so this PR shows no checks. Its content is
      # deterministic output of two generators that already ran green in this
      # job, so there is nothing new for a check to prove -- but if required
      # checks block the merge, the PR needs a PAT instead of GITHUB_TOKEN.
      - name: Open a pull request against the protected branch
        if: steps.stage.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="bot/regenerate-inventory-${GITHUB_RUN_NUMBER}"
          git push --force-with-lease origin "HEAD:${BRANCH}"

          # An open PR from a previous run is reused rather than stacked, so a
          # busy day does not leave a dozen bot PRs saying the same thing.
          EXISTING=$(gh pr list --base main --head "${BRANCH}" --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            echo "Updated existing PR #${EXISTING}."
            exit 0
          fi

          gh pr create --base main --head "${BRANCH}" \
            --title "Regenerate the API inventory and console" \
            --body "$(cat <<'BODY'
          Generated by the API automation workflow from `collections/` and `bruno/`.

          - `api-docs/API_File.json` / `.csv` — the endpoint inventory
          - `docs/platform-ui/unified-console.html` — rebuilt so the console
            shows the same endpoints the inventory now holds
          - `docs/platform-handoff/sample-catalogue.json` — if the build changed it

          `main` is protected, so this arrives as a PR rather than a direct
          push. The diff is deterministic output of `scripts/generate-api-file.js`
          and `scripts/build_unified_console.py`; re-running either reproduces it.

          No checks appear here: a PR opened with `GITHUB_TOKEN` does not trigger
          workflows, by design.
          BODY
          )"
          echo "Opened a pull request from ${BRANCH}."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt

      - name: Generate generic pytest tests
        run: python scripts/generate-generic-tests.py

      - name: Run auto-generated tests with reports
        id: autogenerated-tests
        continue-on-error: true
        run: |
          mkdir -p reports/html reports/allure-results/generated-tests
          python -m pytest build/auto_generated \
            --html=reports/html/auto-generated-pytest-report.html \
            --self-contained-html \
            --alluredir=reports/allure-results/generated-tests

      - name: Generate unified HTML index
        if: always()
        run: node scripts/generate-html-index.js

      - name: Setup Java (required for Allure)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate Allure HTML report for auto-generated tests
        if: always()
        run: |
          npx allure generate reports/allure-results/generated-tests --clean -o reports/allure-report/auto-generated-tests
          python -m pip install allure-combine
          python -c "from allure_combine import combine; combine.combine_allure('reports/allure-report/auto-generated-tests')"
          cp reports/allure-report/auto-generated-tests/complete.html reports/allure-report/auto-generated-tests/index.html

      - name: Upload auto-generated test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-generated-api-test-reports-${{ github.run_number }}
          path: |
            reports/html/index.html
            reports/html/auto-generated-pytest-report.html
            reports/allure-results/generated-tests/
            reports/allure-report/auto-generated-tests/
          retention-days: 30


  api-tests:
    runs-on: ubuntu-latest

    env:
      API_TEST_ENV:     ${{ inputs.environment || 'uat' }}
      EMP_CODE:          ${{ secrets.EMP_CODE }}
      EMP_PASSWORD:      ${{ secrets.EMP_PASSWORD }}
      BASE_URL:            ${{ secrets.BASE_URL }}
      AUTH_BASE_URL:       "https://uat-mcdp-be.omfysgroup.com"
      LEAVE_BASE_URL:      "https://devmcdphcmplatform.omfysgroup.com"
      ATTENDANCE_BASE_URL: "https://uatmcdphcmplatform.omfysgroup.com"
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt

      - name: Lint OpenAPI spec
        run: npm run lint:spec

      - name: Run API tests
        id: run-tests
        env:
          ENV: ${{ inputs.environment || 'uat' }}
          COLLECTION_FILTER: ${{ inputs.collection || 'all' }}
        run: node scripts/run-newman.js

      - name: Generate API File
        run: node scripts/generate-api-file.js

      - name: Generate generic pytest tests
        run: python scripts/generate-generic-tests.py

      - name: Run auto-generated tests with reports
        id: autogenerated-tests
        continue-on-error: true
        run: |
          mkdir -p reports/html reports/allure-results/generated-tests
          python -m pytest build/auto_generated \
            --html=reports/html/auto-generated-pytest-report.html \
            --self-contained-html \
            --alluredir=reports/allure-results/generated-tests

      - name: Generate unified HTML index
        if: always()
        run: node scripts/generate-html-index.js

      - name: Setup Java (required for Allure)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Get previous Allure history
        uses: dawidd6/action-download-artifact@v3
        if: always()
        continue-on-error: true
        with:
          workflow: api-tests.yml
          name_is_regexp: true
          name: allure-html-report-.*
          path: old-reports/

      - name: Copy Allure history & create environment properties
        if: always()
        run: |
          mkdir -p reports/allure-results
          cp -r old-reports/*/history reports/allure-results/history || true
          echo "Pipeline=GitHub Actions" >> reports/allure-results/environment.properties
          echo "Branch=${{ github.ref_name }}" >> reports/allure-results/environment.properties
          echo "Commit=${{ github.sha }}" >> reports/allure-results/environment.properties
          echo "Run ID=${{ github.run_id }}" >> reports/allure-results/environment.properties

      - name: Generate Allure HTML report
        if: always()
        run: |
          node scripts/generate-allure.js
          python -m pip install allure-combine
          python -c "from allure_combine import combine; combine.combine_allure('reports/allure-report')"
          cp reports/allure-report/complete.html reports/allure-report/index.html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-report-${{ github.run_number }}
          path: reports/html/
          retention-days: 30

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ github.run_number }}
          path: reports/allure-results/
          retention-days: 30

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-html-report-${{ github.run_number }}
          path: reports/allure-report/
          retention-days: 30

      - name: Fail if auto-generated tests failed
        if: steps.autogenerated-tests.outcome == 'failure'
        run: exit 1

      - name: Write job summary
        if: always()
        run: |
          echo "## 📊 API Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment || 'uat' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Collection:** ${{ inputs.collection || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Reports from Artifacts Below:" >> $GITHUB_STEP_SUMMARY
          echo "* 📄 **Consolidated HTML Index**: Download \`html-report-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* 📊 **Single-file Allure Report**: Download \`allure-html-report-${{ github.run_number }}\` (open \`complete.html\` in browser)" >> $GITHUB_STEP_SUMMARY

      - name: Slack alert on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: >-
            {"text":"API tests FAILED on
            ${{ github.ref_name }} -
            Run #${{ github.run_number }} -
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}


