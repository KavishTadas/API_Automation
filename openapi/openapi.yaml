# TLS note: dev_mcdp_be.omfysgroup.com requires certificate pinning because its
# underscore triggers an RFC 6125 hostname-validation quirk; this is not a real
# certificate security issue. See scripts/pinned_tls.py and
# scripts/pinned-tls-agent.js. The pinned certificate expires Aug 11 2026 and
# the fingerprint must be updated when that certificate rotates.
openapi: 3.1.0

info:
  title: HCM API Automation Suite
  version: 2.0.0
  description: >
    OpenAPI 3.1 contract for the HCM API automation suite.
    Covers authentication and leave-management endpoints.
    x-qa-status values: "verified" = tested and passing,
    "scaffold" = defined but not yet tested.

# Root discovery list for OpenAPI tooling. Each operation below overrides this
# list with its one authoritative host so auth and leave traffic cannot mix.
servers:
  - url: "https://dev_mcdp_be.omfysgroup.com"
    description: Development authentication host (certificate pin required)
  - url: "https://devmcdphcmplatform.omfysgroup.com"
    description: Development HCM platform host

tags:
  - name: Authentication
    description: Login and JWT token management
  - name: Leave Module
    description: Leave reporting

paths:

  /auth/token:
    post:
      servers:
        - url: "https://dev_mcdp_be.omfysgroup.com"
          description: Development authentication host (certificate pin required)
      tags: [Authentication]
      operationId: loginEmployee
      description: >
        Authenticates an employee using empCode and password.
        Returns a JWT bearer token valid for 2 hours, the
        employee display name, assigned roles, and empCode.
        Store the returned token as authToken for all
        subsequent authenticated requests.
      summary: Authenticate employee and return JWT token
      x-sla-ms: 1000
      x-required-role: none
      x-qa-status: verified
      x-qa-notes: >
        TC01 status 200 + token string length > 20 + empCode match
        + username non-empty + roles non-empty array.
        TC02 wrong password returns 400 with message field.
        TC03 missing empCode returns 400 with message field.
        Token stored as authToken in Newman environment for
        downstream leave endpoint requests. Requests up to 1 MiB
        (1,048,576 bytes) were processed normally, with no
        payload-size-specific rejection observed; oversized test payloads
        failed only on ordinary credential validation, for example HTTP 400
        "Invalid password". The true maximum, if any, is untested beyond
        that point. Testing was deliberately stopped at 1 MiB to avoid
        placing undue load on infrastructure outside this project's ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              empCode: "EMP-SAMPLE-001"
              password: "REPLACE_WITH_TEST_PASSWORD"
      responses:
        "200":
          description: Authentication successful — JWT token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                empCode: "EMP-SAMPLE-001"
                roles: ["ROLE_EMPLOYEE", "ROLE_BDH"]
                token: "eyJhbGciOiJIUzI1NiJ9..."
                username: "Sample Employee"
        "400":
          description: Invalid credentials or missing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidEmpCode:
                  value: { "message": "Invalid empCode" }
                missingEmpCode:
                  value: { "message": "empCode is required" }
        "429":
          description: Not yet observed in live traffic — documented per REST convention, unverified.
          x-qa-status: scaffold
        "5XX":
          description: Not yet observed in live traffic — documented per REST convention, unverified.
          x-qa-status: scaffold

  /user/leaves/getAllLeaveReports:
    get:
      servers:
        - url: "https://devmcdphcmplatform.omfysgroup.com"
          description: Development HCM platform host
      tags: [Leave Module]
      operationId: getAllLeaveReports
      description: >
        Returns the observed leave-report structure for the requested
        month and year, including aggregate status counts and the
        complete leaveReport array.
      summary: Get all leave reports for a month and year
      x-sla-ms: 3000
      x-idempotent: true
      x-required-role: authenticated-employee
      x-qa-status: scaffold
      x-qa-notes: >
        Schema scaffolded from an authenticated HTTP 200 capture for
        month=4 and year=2026. All documented response fields were
        observed in that capture; no legacy leave fields were carried over.
        Ten sequential requests using a single token completed successfully:
        all returned HTTP 200 with a consistent 177,973-byte response, and no
        rate-limiting (HTTP 429) or blocking response was observed. This does
        not establish the actual rate-limit threshold, if any; it establishes
        only that a small burst of this size is not rejected. Testing was
        deliberately kept small to avoid placing load on infrastructure
        outside this project's ownership.
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: integer
          example: 4
        - name: year
          in: query
          required: true
          schema:
            type: integer
          example: 2026
      responses:
        "200":
          description: Leave report fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllLeaveReportsResponse'
        "400":
          description: Invalid month query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllLeaveReportsErrorResponse'
              example:
                status: error
                errorCode: INVALID_MONTH
                message: Month must be between 1 and 12.
                data: null
                timestamp: 04-Aug-2026 T09:53:23
        "401":
          description: Bearer token is expired or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllLeaveReportsErrorResponse'
              example:
                status: error
                errorCode: INVALID_TOKEN
                message: Token has expired or invalid
                data: null
                timestamp: 04-Aug-2026 T09:53:21
        "429":
          description: Not yet observed in live traffic — documented per REST convention, unverified.
          x-qa-status: scaffold
        "5XX":
          description: Not yet observed in live traffic — documented per REST convention, unverified.
          x-qa-status: scaffold

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT obtained from POST /auth/token. Stored as
        {{authToken}} in Newman environment and injected
        as Authorization: Bearer {{authToken}} header on
        all leave module requests.

  schemas:

    LoginRequest:
      type: object
      required: [empCode, password]
      properties:
        empCode:
          type: string
          example: "EMP-SAMPLE-001"
        password:
          type: string
          minLength: 6
          example: "REPLACE_WITH_TEST_PASSWORD"

    LoginResponse:
      type: object
      required: [empCode, roles, token, username]
      properties:
        empCode:
          type: string
          example: "EMP-SAMPLE-001"
        roles:
          type: array
          items:
            type: string
          example: ["ROLE_EMPLOYEE", "ROLE_BDH"]
        token:
          type: string
          minLength: 20
          example: "eyJhbGciOiJIUzI1NiJ9..."
        username:
          type: string
          example: "Jasprit Bumrah"

    GetAllLeaveReportsResponse:
      type: object
      additionalProperties: false
      required: [status, errorCode, message, data, timestamp]
      properties:
        status:
          type: string
        errorCode:
          type: "null"
        message:
          type: string
        data:
          $ref: '#/components/schemas/GetAllLeaveReportsData'
        timestamp:
          type: string

    GetAllLeaveReportsData:
      type: object
      additionalProperties: false
      required: [count, leaveReport]
      properties:
        count:
          $ref: '#/components/schemas/LeaveReportCount'
        leaveReport:
          type: array
          items:
            $ref: '#/components/schemas/GetAllLeaveReportsItem'

    LeaveReportCount:
      type: object
      additionalProperties: false
      required: [approved, pending, cancelled, rejected]
      properties:
        approved:
          type: integer
        pending:
          type: integer
        cancelled:
          type: integer
        rejected:
          type: integer

    GetAllLeaveReportsItem:
      type: object
      additionalProperties: false
      x-qa-notes: >
        purpose can be null for bulk/administratively-created leave entries.
        The observed signature is consecutive lr_no values in steps of 2, a
        shared application_date, a shared single leave date, many distinct
        employees, and one leave_type. March 2026 contained a 25-record LWP
        batch matching this signature. Individual employee-submitted leave
        requests are expected to always have a populated purpose.
      required:
        - lr_no
        - lr_id
        - subject
        - application_date
        - status
        - start_date
        - end_date
        - leave_type
        - emp_name
        - day_type
        - empid
        - purpose
        - reason
      properties:
        lr_no:
          type: integer
        lr_id:
          type: integer
        subject:
          type: string
        application_date:
          type: string
          description: Observed format DD-Mon-YYYY, for example 15-Apr-2026
        status:
          type: string
        start_date:
          type: string
          description: Observed format DD-Mon-YYYY, for example 17-Apr-2026
        end_date:
          type: string
          description: Observed format DD-Mon-YYYY, for example 17-Apr-2026
        leave_type:
          type: string
        emp_name:
          type: string
        day_type:
          type: string
        empid:
          type: integer
        purpose:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]

    GetAllLeaveReportsErrorResponse:
      type: object
      additionalProperties: false
      required: [status, errorCode, message, data, timestamp]
      properties:
        status:
          type: string
          const: error
        errorCode:
          type: string
          enum: [INVALID_MONTH, INVALID_TOKEN]
        message:
          type: string
        data:
          type: "null"
        timestamp:
          type: string
          description: Observed format DD-Mon-YYYY THH:MM:SS
          pattern: '^\d{2}-[A-Za-z]{3}-\d{4} T\d{2}:\d{2}:\d{2}$'

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "Invalid empCode"
